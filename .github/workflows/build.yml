name: Build LocalLLM APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Gradle Wrapper को चलाने की परमिशन देना (ज़रूरी स्टेप)
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LocalLLM-debug-apk
          # यह पाथ सुनिश्चित करें कि आपकी फाइल संरचना के अनुसार सही है
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload Logs on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: app/build/reports/
