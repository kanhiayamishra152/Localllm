name: Build LocalLLM APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 1. NDK और CMake इंस्टॉल करना (तुम्हारे C++ / Llama कोड के लिए बहुत ज़रूरी)
      - name: Install Android NDK
        run: |
          yes | sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      # 2. llama.cpp को क्लोन करना (इसके बिना बिल्ड फेल हो जाएगा)
      - name: Clone llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git external/llama.cpp

      # 3. Wrapper (.jar) की जगह ग्लोबल Gradle का इस्तेमाल (ताकि वो नई वाली Error न आए)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # 4. APK बिल्ड करना (यहाँ ./gradlew की जगह सिर्फ gradle इस्तेमाल करेंगे)
      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      # 5. APK अपलोड करना
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LocalLLM-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
